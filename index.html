<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>3D Spiral Staircase Calculator</title>

<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- THREE.JS & ORBIT CONTROLS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg-main: #121212;
    --bg-vp: #181818;
    --bg-panel: #1e1e1e;
    --bg-input: #2a2a2a;
    --border-color: #3a3a3a;
    --accent: #4caf50;
    --accent-hover: #43a047;
    --text-main: #ffffff;
    --text-muted: #b0b0b0;
    --res-val: #81c784;
}

html, body {
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg-main);
    color: var(--text-main);
}

.app-container {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100dvh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--bg-main);
}

/* Top Bar with Language Switcher */
.top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border-color);
    flex-shrink: 0;
    gap: 8px;
}

.app-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.lang-switch {
    display: flex;
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 2px;
    flex-shrink: 0;
}

.lang-btn {
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.lang-btn.active {
    background: var(--accent);
    color: #fff;
}

/* 3D Viewport */
#viewport {
    position: relative;
    width: 100%;
    height: 43dvh;
    min-height: 215px;
    background: var(--bg-vp);
    touch-action: none;
    flex-shrink: 0;
    cursor: grab;
}

#viewport:active {
    cursor: grabbing;
}

#viewport canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
    touch-action: none;
}

.hint {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0, 0, 0, 0.72);
    padding: 5px 10px;
    border-radius: 16px;
    font-size: 11px;
    color: #ddd;
    pointer-events: none;
    z-index: 5;
    border: 1px solid rgba(255, 255, 255, 0.12);
}

.vp-status {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    text-align: center;
    font-size: 13px;
    color: #ffb4b4;
    background: rgba(24, 24, 24, 0.9);
    z-index: 6;
}

/* Controls & Results Scroll Area */
.sidebar {
    flex: 1;
    width: 100%;
    background: var(--bg-panel);
    padding: 11px 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

.grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.input-group {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.input-group label {
    font-size: 11.5px;
    color: var(--text-muted);
}

.input-group input,
.input-group select {
    width: 100%;
    padding: 8px 10px;
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    border-radius: 7px;
    font-size: 14px;
    outline: none;
}

.input-group input:focus,
.input-group select:focus {
    border-color: var(--accent);
}

.action-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.action-row-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 7px;
}

button.btn-calc {
    padding: 10px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
}

button.btn-calc:active {
    background: var(--accent-hover);
    transform: scale(0.99);
}

button.btn-share {
    padding: 10px;
    background: #2b5278;
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
}

button.btn-share:active {
    background: #234363;
}

button.btn-tool {
    padding: 9px 8px;
    background: #2c2f33;
    border: 1px solid #444;
    color: #eee;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
}

button.btn-tool:active {
    background: #3a3e44;
}

.results {
    background: var(--bg-main);
    padding: 10px 12px;
    border-radius: 8px;
    border-left: 4px solid var(--accent);
}

.res-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    margin-bottom: 6px;
}

.res-item:last-child {
    margin-bottom: 0;
}

.res-value {
    font-weight: 700;
    color: var(--res-val);
}

/* Dimension Table Modal */
.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.78);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 14px;
    z-index: 50;
}

.modal-backdrop.open {
    display: flex;
}

.modal-card {
    width: 100%;
    max-width: 520px;
    max-height: 84dvh;
    background: #1e1e1e;
    border: 1px solid #444;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 14px;
    background: #252525;
    border-bottom: 1px solid #383838;
}

.modal-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
}

.modal-close {
    background: #333;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
}

.table-wrap {
    flex: 1;
    overflow: auto;
    padding: 10px 12px;
}

table.dim-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}

table.dim-table th,
table.dim-table td {
    padding: 7px 8px;
    border-bottom: 1px solid #303030;
    text-align: left;
}

table.dim-table th {
    background: #262626;
    color: #81c784;
    position: sticky;
    top: 0;
}

.modal-footer {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    background: #252525;
    border-top: 1px solid #383838;
}

/* Tablet & Desktop Wide Layout */
@media (min-width: 769px) {
    .app-container {
        flex-direction: row;
        flex-wrap: wrap;
    }

    .top-bar {
        width: 100%;
    }

    #viewport {
        flex: 1;
        height: calc(100dvh - 46px);
    }

    .sidebar {
        width: 350px;
        flex: none;
        height: calc(100dvh - 46px);
        border-left: 1px solid var(--border-color);
    }
}
</style>
</head>

<body>

<div class="app-container">

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="app-title" id="t-title">3D ကြောင်လိမ်လှေကား Calculator</div>
        <div class="lang-switch" role="group" aria-label="Language Switch">
            <button type="button" class="lang-btn active" id="btn-my" onclick="setLanguage('my')">မြန်မာ</button>
            <button type="button" class="lang-btn" id="btn-en" onclick="setLanguage('en')">EN</button>
        </div>
    </div>

    <!-- 3D VIEWPORT -->
    <div id="viewport">
        <div class="hint" id="t-hint">🖱 လှည့်ရန်: ဆွဲပါ | Zoom: Pinch / Scroll</div>
        <div class="vp-status" id="vpStatus"></div>
    </div>

    <!-- CONTROLS & RESULTS -->
    <div class="sidebar">
        <div class="grid-2">
            <div class="input-group">
                <label id="l-unit" for="unitSelect">အသုံးပြုမည့် ယူနစ် (Unit):</label>
                <select id="unitSelect" onchange="handleUnitChange()">
                    <option value="mm">Millimeter (mm)</option>
                    <option value="cm">Centimeter (cm)</option>
                    <option value="inch">Inch (လက်မ / in)</option>
                    <option value="ft" selected>Feet (ပေ / ft)</option>
                </select>
            </div>

            <div class="input-group">
                <label id="l-height" for="height">လှေကား အမြင့် (H):</label>
                <input type="number" id="height" value="8.86" step="any" inputmode="decimal" oninput="updateStaircase()">
            </div>

            <div class="input-group">
                <label id="l-outerDia" for="outerDia">အပြင်ဘက် အချင်း (D1):</label>
                <input type="number" id="outerDia" value="6.56" step="any" inputmode="decimal" oninput="updateStaircase()">
            </div>

            <div class="input-group">
                <label id="l-innerDia" for="innerDia">အတွင်း အလယ်တိုင် (D2):</label>
                <input type="number" id="innerDia" value="0.33" step="any" inputmode="decimal" oninput="updateStaircase()">
            </div>

            <div class="input-group">
                <label id="l-steps" for="steps">အဆင့် အရေအတွက် (C):</label>
                <input type="number" id="steps" value="11" min="1" step="1" inputmode="numeric" oninput="updateStaircase()">
            </div>

            <div class="input-group">
                <label id="l-turnAngle" for="turnAngle">လှည့်သည့် ထောင့် (°):</label>
                <input type="number" id="turnAngle" value="450" step="any" inputmode="decimal" oninput="updateStaircase()">
            </div>
        </div>

        <div class="action-row">
            <button type="button" class="btn-calc" id="btn-redraw" onclick="updateStaircase()">3D ပြန်လည်ဆွဲထုတ်မည်</button>
            <button type="button" class="btn-share" id="btn-send" onclick="sendResultToTelegram()">ပို့မည်</button>
        </div>

        <div class="action-row-3">
            <button type="button" class="btn-tool" id="btn-png" onclick="export3DPNG()">🖼 PNG ထုတ်မည်</button>
            <button type="button" class="btn-tool" id="btn-table" onclick="openDimensionModal()">📏 Dimension ဇယား</button>
            <button type="button" class="btn-tool" id="btn-reset-cam" onclick="resetCameraView()">🎥 View Reset</button>
        </div>

        <div class="results">
            <div class="res-item">
                <span id="r-riser-lbl">အဆင့် အမြင့် (Riser):</span>
                <span class="res-value" id="resRiser">-</span>
            </div>
            <div class="res-item">
                <span id="r-len-lbl">ခြေနင်းအရှည် (Step Length):</span>
                <span class="res-value" id="resLength">-</span>
            </div>
            <div class="res-item">
                <span id="r-outer-lbl">အပြင်ဘက်အဝန်း (Outer Arc):</span>
                <span class="res-value" id="resOuterWidth">-</span>
            </div>
            <div class="res-item">
                <span id="r-angle-lbl">အဆင့် လှည့်ထောင့် (Step Angle):</span>
                <span class="res-value" id="resStepAngle">-</span>
            </div>
        </div>
    </div>

</div>

<!-- DIMENSION TABLE MODAL -->
<div class="modal-backdrop" id="dimModal" onclick="handleBackdropClick(event)">
    <div class="modal-card">
        <div class="modal-header">
            <div class="modal-title" id="m-title">အဆင့်အလိုက် Dimension ဇယား</div>
            <button type="button" class="modal-close" id="m-close" onclick="closeDimensionModal()">ပိတ်မည်</button>
        </div>
        <div class="table-wrap">
            <table class="dim-table">
                <thead>
                    <tr>
                        <th id="th-step">Step</th>
                        <th id="th-elev">Height (Y)</th>
                        <th id="th-angle">Cum. Angle</th>
                        <th id="th-arc">Outer Arc</th>
                    </tr>
                </thead>
                <tbody id="dimTableBody"></tbody>
            </table>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-calc" id="m-copy" onclick="copyDimensionTable()">ဇယား ကူးယူမည်</button>
        </div>
    </div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

const I18N = {
    my: {
        title: "3D ကြောင်လိမ်လှေကား Calculator",
        hint: "🖱 လှည့်ရန်: ဆွဲပါ | Zoom: Pinch / Scroll",
        unit: "အသုံးပြုမည့် ယူနစ် (Unit):",
        height: "လှေကား အမြင့် (H):",
        outerDia: "အပြင်ဘက် အချင်း (D1):",
        innerDia: "အတွင်း အလယ်တိုင် (D2):",
        steps: "အဆင့် အရေအတွက် (C):",
        turnAngle: "လှည့်သည့် ထောင့် (°):",
        redraw: "3D ပြန်လည်ဆွဲထုတ်မည်",
        send: "ပို့မည်",
        png: "🖼 PNG ထုတ်မည်",
        table: "📏 Dimension ဇယား",
        resetCam: "🎥 View Reset",
        riserLbl: "အဆင့် အမြင့် (Riser):",
        lenLbl: "ခြေနင်းအရှည် (Step Length):",
        outerLbl: "အပြင်ဘက်အဝန်း (Outer Arc):",
        angleLbl: "အဆင့် လှည့်ထောင့် (Step Angle):",
        unitNames: { mm: "mm", cm: "cm", inch: "in", ft: "ft" },
        shareHeader: "📐 *3D ကြောင်လိမ်လှေကား တွက်ချက်မှု*",
        webglErr: "3D WebGL ဖွင့်မရပါ (Browser သို့မဟုတ် Telegram WebView တွင် WebGL ဖွင့်ထားရန် လိုအပ်ပါသည်)။",
        modalTitle: "အဆင့်အလိုက် Dimension ဇယား",
        closeBtn: "ပိတ်မည်",
        copyTable: "ဇယား ကူးယူမည်",
        copiedTable: "Dimension ဇယားကို Copy ကူးယူပြီးပါပြီ။",
        thStep: "အဆင့်",
        thElev: "အမြင့်",
        thAngle: "စုစုပေါင်းထောင့်",
        thArc: "အပြင်အဝန်း"
    },
    en: {
        title: "3D Spiral Staircase Calculator",
        hint: "🖱 Rotate: Drag | Zoom: Pinch / Scroll",
        unit: "Measurement Unit:",
        height: "Total Height (H):",
        outerDia: "Outer Diameter (D1):",
        innerDia: "Center Pole Dia (D2):",
        steps: "Number of Steps (C):",
        turnAngle: "Total Turn Angle (°):",
        redraw: "Redraw 3D",
        send: "Send",
        png: "🖼 Export PNG",
        table: "📏 Dimension Table",
        resetCam: "🎥 Reset View",
        riserLbl: "Riser Height:",
        lenLbl: "Step Length:",
        outerLbl: "Outer Tread Arc:",
        angleLbl: "Angle per Step:",
        unitNames: { mm: "mm", cm: "cm", inch: "in", ft: "ft" },
        shareHeader: "📐 *3D Spiral Staircase Calculation*",
        webglErr: "Unable to initialize 3D WebGL context in this browser/webview.",
        modalTitle: "Step-by-Step Dimension Table",
        closeBtn: "Close",
        copyTable: "Copy Table",
        copiedTable: "Dimension table copied to clipboard.",
        thStep: "Step",
        thElev: "Elevation",
        thAngle: "Cum. Angle",
        thArc: "Outer Arc"
    }
};

let currentLang = "my";
let previousUnit = "ft";
let latestSummary = null;
let latestRows = [];

let scene, camera, renderer, controls;
let stairGroup = new THREE.Group();
let balusterGroup = new THREE.Group();
let handrailGroup = new THREE.Group();

let fallbackTarget = new THREE.Vector3(0, 1200, 0);
let spherical = new THREE.Spherical(6500, Math.PI / 3, Math.PI / 4);
let lastCameraPose = null;

function showViewportError(msg) {
    const statusEl = document.getElementById("vpStatus");
    if (!statusEl) return;
    statusEl.innerText = msg;
    statusEl.style.display = "flex";
}

function hideViewportError() {
    const statusEl = document.getElementById("vpStatus");
    if (!statusEl) return;
    statusEl.style.display = "none";
}

function initTelegram() {
    if (!tg) return;
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) {
        try { tg.setHeaderColor("#1e1e1e"); } catch (e) {}
    }
    if (tg.setBackgroundColor) {
        try { tg.setBackgroundColor("#121212"); } catch (e) {}
    }
}

function setLanguage(lang) {
    currentLang = lang;
    document.documentElement.lang = lang;
    document.getElementById("btn-my").classList.toggle("active", lang === "my");
    document.getElementById("btn-en").classList.toggle("active", lang === "en");

    const t = I18N[lang];
    document.getElementById("t-title").innerText = t.title;
    document.getElementById("t-hint").innerText = t.hint;
    document.getElementById("l-unit").innerText = t.unit;
    document.getElementById("l-height").innerText = t.height;
    document.getElementById("l-outerDia").innerText = t.outerDia;
    document.getElementById("l-innerDia").innerText = t.innerDia;
    document.getElementById("l-steps").innerText = t.steps;
    document.getElementById("l-turnAngle").innerText = t.turnAngle;
    document.getElementById("btn-redraw").innerText = t.redraw;
    document.getElementById("btn-send").innerText = t.send;
    document.getElementById("btn-png").innerText = t.png;
    document.getElementById("btn-table").innerText = t.table;
    document.getElementById("btn-reset-cam").innerText = t.resetCam;
    document.getElementById("r-riser-lbl").innerText = t.riserLbl;
    document.getElementById("r-len-lbl").innerText = t.lenLbl;
    document.getElementById("r-outer-lbl").innerText = t.outerLbl;
    document.getElementById("r-angle-lbl").innerText = t.angleLbl;

    document.getElementById("m-title").innerText = t.modalTitle;
    document.getElementById("m-close").innerText = t.closeBtn;
    document.getElementById("m-copy").innerText = t.copyTable;
    document.getElementById("th-step").innerText = t.thStep;
    document.getElementById("th-elev").innerText = t.thElev;
    document.getElementById("th-angle").innerText = t.thAngle;
    document.getElementById("th-arc").innerText = t.thArc;

    updateStaircase();
}

function getScaleToMM(unit) {
    if (unit === "mm") return 1;
    if (unit === "cm") return 10;
    if (unit === "inch") return 25.4;
    if (unit === "ft") return 304.8;
    return 1;
}

function handleUnitChange() {
    const newUnit = document.getElementById("unitSelect").value;
    const oldScale = getScaleToMM(previousUnit);
    const newScale = getScaleToMM(newUnit);
    const ratio = oldScale / newScale;

    const ids = ["height", "outerDia", "innerDia"];
    ids.forEach(id => {
        const el = document.getElementById(id);
        const val = parseFloat(el.value);
        if (!isNaN(val)) {
            const converted = val * ratio;
            el.value = newUnit === "mm" ? converted.toFixed(1) : converted.toFixed(2);
        }
    });

    previousUnit = newUnit;
    updateStaircase();
}

function attachFallbackOrbit(domEl) {
    let isDragging = false;
    let prevX = 0;
    let prevY = 0;
    let lastPinchDist = null;

    function applySpherical() {
        spherical.phi = Math.max(0.15, Math.min(Math.PI - 0.15, spherical.phi));
        spherical.radius = Math.max(500, Math.min(50000, spherical.radius));
        const offset = new THREE.Vector3().setFromSpherical(spherical);
        camera.position.copy(fallbackTarget).add(offset);
        camera.lookAt(fallbackTarget);
    }

    domEl.addEventListener("pointerdown", (e) => {
        isDragging = true;
        prevX = e.clientX;
        prevY = e.clientY;
        if (domEl.setPointerCapture) {
            try { domEl.setPointerCapture(e.pointerId); } catch (err) {}
        }
        e.stopPropagation();
    });

    domEl.addEventListener("pointermove", (e) => {
        if (!isDragging) return;
        const dx = e.clientX - prevX;
        const dy = e.clientY - prevY;
        prevX = e.clientX;
        prevY = e.clientY;

        spherical.theta -= dx * 0.008;
        spherical.phi -= dy * 0.008;
        applySpherical();
        e.stopPropagation();
    });

    const endDrag = (e) => {
        isDragging = false;
        if (domEl.releasePointerCapture && e && e.pointerId !== undefined) {
            try { domEl.releasePointerCapture(e.pointerId); } catch (err) {}
        }
    };

    domEl.addEventListener("pointerup", endDrag);
    domEl.addEventListener("pointercancel", endDrag);

    domEl.addEventListener("wheel", (e) => {
        e.preventDefault();
        e.stopPropagation();
        spherical.radius *= e.deltaY > 0 ? 1.08 : 0.92;
        applySpherical();
    }, { passive: false });

    domEl.addEventListener("touchstart", (e) => {
        if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            lastPinchDist = Math.hypot(dx, dy);
        }
    }, { passive: true });

    domEl.addEventListener("touchmove", (e) => {
        if (e.touches.length === 2 && lastPinchDist) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.hypot(dx, dy);
            if (dist > 0) {
                spherical.radius *= lastPinchDist / dist;
                lastPinchDist = dist;
                applySpherical();
            }
        }
    }, { passive: true });

    domEl.addEventListener("touchend", () => {
        lastPinchDist = null;
    });

    return applySpherical;
}

let updateFallbackCamera = null;

function init3D() {
    const container = document.getElementById("viewport");
    if (!container || typeof THREE === "undefined") {
        showViewportError(I18N[currentLang].webglErr);
        return;
    }

    const width = Math.max(container.clientWidth, 1);
    const height = Math.max(container.clientHeight, 215);

    try {
        renderer = new THREE.WebGLRenderer({
            antialias: true,
            preserveDrawingBuffer: true,
            powerPreference: "default"
        });
    } catch (err) {
        showViewportError(I18N[currentLang].webglErr);
        return;
    }

    hideViewportError();
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x181818);

    camera = new THREE.PerspectiveCamera(45, width / height, 1, 500000);
    renderer.setSize(width, height, false);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.domElement.style.touchAction = "none";
    container.appendChild(renderer.domElement);

    if (typeof THREE.OrbitControls === "function") {
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.rotateSpeed = 0.9;
        controls.zoomSpeed = 1.0;
        controls.enableZoom = true;
        controls.enablePan = false;
    } else {
        updateFallbackCamera = attachFallbackOrbit(renderer.domElement);
    }

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.78);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
    dirLight.position.set(3000, 5000, 3000);
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.35);
    fillLight.position.set(-3000, 2000, -3000);
    scene.add(fillLight);

    const grid = new THREE.GridHelper(12000, 40, 0x444444, 0x222222);
    scene.add(grid);

    scene.add(stairGroup);
    scene.add(balusterGroup);
    scene.add(handrailGroup);

    window.addEventListener("resize", onWindowResize);
    if (window.ResizeObserver) {
        new ResizeObserver(() => onWindowResize()).observe(container);
    }

    updateStaircase();
    onWindowResize();
    animate();
}

function clearGroup(group) {
    while (group.children.length > 0) {
        const child = group.children[0];
        group.remove(child);
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
            if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
            else child.material.dispose();
        }
    }
}

function updateStaircase() {
    const unit = document.getElementById("unitSelect").value;
    const unitLabel = I18N[currentLang].unitNames[unit] || unit;

    let H = parseFloat(document.getElementById("height").value) || 0;
    let D1 = parseFloat(document.getElementById("outerDia").value) || 0;
    let D2 = parseFloat(document.getElementById("innerDia").value) || 0;
    const C = Math.max(1, Math.min(200, parseInt(document.getElementById("steps").value) || 1));
    const A = parseFloat(document.getElementById("turnAngle").value) || 0;

    const scaleToMM = getScaleToMM(unit);
    const H_mm = H * scaleToMM;
    const D1_mm = D1 * scaleToMM;
    const D2_mm = D2 * scaleToMM;

    const riserHeight = H / C;
    const outerRadius = D1_mm / 2;
    const innerRadius = Math.min(D2_mm / 2, Math.max(0, outerRadius * 0.85));
    const stepLength = Math.max(0, (D1 - D2) / 2);
    const stepAngle = A / C;
    const stepAngleRad = stepAngle * Math.PI / 180;
    const outerWidth = (Math.PI * D1 * Math.abs(stepAngle)) / 360;

    const riserStr = `${riserHeight.toFixed(2)} ${unitLabel}`;
    const lenStr = `${stepLength.toFixed(2)} ${unitLabel}`;
    const outerStr = `${outerWidth.toFixed(2)} ${unitLabel}`;
    const angleStr = `${stepAngle.toFixed(2)}°`;

    document.getElementById("resRiser").innerText = riserStr;
    document.getElementById("resLength").innerText = lenStr;
    document.getElementById("resOuterWidth").innerText = outerStr;
    document.getElementById("resStepAngle").innerText = angleStr;

    latestRows = [];
    for (let s = 1; s <= C; s++) {
        latestRows.push({
            step: s,
            elevation: `${(riserHeight * s).toFixed(2)} ${unitLabel}`,
            cumAngle: `${(stepAngle * s).toFixed(1)}°`,
            outerArc: outerStr
        });
    }

    latestSummary = {
        lang: currentLang,
        unit,
        unitLabel,
        H, D1, D2, C, A,
        riser: riserStr,
        stepLength: lenStr,
        outerWidth: outerStr,
        stepAngle: angleStr
    };

    if (!scene || !camera) return;

    clearGroup(stairGroup);
    clearGroup(balusterGroup);
    clearGroup(handrailGroup);

    if (H_mm <= 0 || D1_mm <= 0) return;

    if (innerRadius > 0) {
        const poleGeo = new THREE.CylinderGeometry(innerRadius, innerRadius, H_mm, 32);
        const poleMat = new THREE.MeshStandardMaterial({ color: 0x909090, metalness: 0.5, roughness: 0.3 });
        const pole = new THREE.Mesh(poleGeo, poleMat);
        pole.position.y = H_mm / 2;
        stairGroup.add(pole);
    }

    const treadThickness = Math.max(15, H_mm / (C * 5));
    const stepMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.45 });
    const railMat = new THREE.MeshStandardMaterial({ color: 0x455a64, metalness: 0.55, roughness: 0.28 });
    const balusterMat = new THREE.MeshStandardMaterial({ color: 0x78909c, metalness: 0.5, roughness: 0.32 });

    const anticlockwise = stepAngleRad >= 0;
    const inset = Math.min(20, Math.max(6, outerRadius * 0.025));
    const railRadius = Math.max(10, outerRadius - inset);
    const railHeightAboveStep = Math.max(300, Math.min(1000, H_mm * 0.35));
    const balusterRadius = Math.max(6, Math.min(16, outerRadius * 0.014));
    const railTubeRadius = Math.max(9, Math.min(22, outerRadius * 0.018));

    const handrailCurvePoints = [];

    for (let i = 0; i < C; i++) {
        const shape = new THREE.Shape();
        shape.moveTo(innerRadius, 0);
        shape.lineTo(outerRadius, 0);
        shape.absarc(0, 0, outerRadius, 0, stepAngleRad, !anticlockwise);
        shape.lineTo(innerRadius * Math.cos(stepAngleRad), innerRadius * Math.sin(stepAngleRad));
        if (innerRadius > 0) {
            shape.absarc(0, 0, innerRadius, stepAngleRad, 0, anticlockwise);
        }
        shape.closePath();

        const extrudeSettings = { depth: treadThickness, bevelEnabled: false };
        const stepGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        const stepMesh = new THREE.Mesh(stepGeo, stepMat);

        stepMesh.rotation.x = Math.PI / 2;
        stepMesh.rotation.z = -i * stepAngleRad;
        const stepY = (i + 1) * (H_mm / C);
        stepMesh.position.y = stepY;

        stairGroup.add(stepMesh);
        stepMesh.updateMatrixWorld(true);

        const halfAngle = stepAngleRad * 0.5;
        const localMidPt = new THREE.Vector3(
            railRadius * Math.cos(halfAngle),
            railRadius * Math.sin(halfAngle),
            0
        );
        const worldMidBase = localMidPt.clone().applyMatrix4(stepMesh.matrixWorld);

        const balusterGeo = new THREE.CylinderGeometry(balusterRadius, balusterRadius, railHeightAboveStep, 12);
        const balusterMesh = new THREE.Mesh(balusterGeo, balusterMat);
        balusterMesh.position.set(worldMidBase.x, stepY + railHeightAboveStep / 2, worldMidBase.z);
        balusterGroup.add(balusterMesh);

        handrailCurvePoints.push(new THREE.Vector3(worldMidBase.x, stepY + railHeightAboveStep, worldMidBase.z));
    }

    if (handrailCurvePoints.length >= 2) {
        const curve = new THREE.CatmullRomCurve3(handrailCurvePoints);
        const tubeGeo = new THREE.TubeGeometry(curve, Math.max(32, C * 10), railTubeRadius, 12, false);
        const railMesh = new THREE.Mesh(tubeGeo, railMat);
        handrailGroup.add(railMesh);
    }

    const maxDim = Math.max(H_mm + railHeightAboveStep, D1_mm);
    const camDist = maxDim * 2.1;
    const targetY = (H_mm + railHeightAboveStep) * 0.48;

    lastCameraPose = {
        pos: new THREE.Vector3(camDist, (H_mm + railHeightAboveStep) * 0.65, camDist),
        target: new THREE.Vector3(0, targetY, 0),
        radius: camDist * 1.4
    };
    resetCameraView();
}

function resetCameraView() {
    if (!lastCameraPose || !camera) return;
    if (controls) {
        camera.position.copy(lastCameraPose.pos);
        controls.target.copy(lastCameraPose.target);
        controls.update();
    } else if (updateFallbackCamera) {
        fallbackTarget.copy(lastCameraPose.target);
        spherical.radius = lastCameraPose.radius;
        spherical.phi = Math.PI / 3;
        spherical.theta = Math.PI / 4;
        updateFallbackCamera();
    }
}

function export3DPNG() {
    if (!renderer || !scene || !camera) return;
    if (controls) controls.update();
    renderer.render(scene, camera);

    const dataUrl = renderer.domElement.toDataURL("image/png");
    const link = document.createElement("a");
    link.download = "spiral-staircase-3d.png";
    link.href = dataUrl;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function openDimensionModal() {
    const tbody = document.getElementById("dimTableBody");
    tbody.innerHTML = "";
    latestRows.forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>#${r.step}</td>
            <td>${r.elevation}</td>
            <td>${r.cumAngle}</td>
            <td>${r.outerArc}</td>
        `;
        tbody.appendChild(tr);
    });
    document.getElementById("dimModal").classList.add("open");
}

function closeDimensionModal() {
    document.getElementById("dimModal").classList.remove("open");
}

function handleBackdropClick(e) {
    if (e.target && e.target.id === "dimModal") {
        closeDimensionModal();
    }
}

function copyDimensionTable() {
    if (!latestRows.length) return;
    const t = I18N[currentLang];
    const lines = [
        `${t.thStep} | ${t.thElev} | ${t.thAngle} | ${t.thArc}`,
        ...latestRows.map(r => `#${r.step} | ${r.elevation} | ${r.cumAngle} | ${r.outerArc}`)
    ];
    const text = lines.join("\n");
    if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
            alert(t.copiedTable);
        });
    }
}

function sendResultToTelegram() {
    if (!latestSummary) return;
    const s = latestSummary;
    const header = I18N[s.lang].shareHeader;
    const text =
        `${header}\n` +
        `• Unit: ${s.unitLabel}\n` +
        `• H: ${s.H} ${s.unitLabel} | D1: ${s.D1} ${s.unitLabel} | D2: ${s.D2} ${s.unitLabel}\n` +
        `• Steps (C): ${s.C} | Turn: ${s.A}°\n` +
        `• Riser: ${s.riser}\n` +
        `• Step Length: ${s.stepLength}\n` +
        `• Outer Arc: ${s.outerWidth}\n` +
        `• Step Angle: ${s.stepAngle}`;

    if (tg && typeof tg.sendData === "function") {
        tg.sendData(JSON.stringify({ type: "spiral_staircase_calc", summaryText: text, data: s }));
    } else if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
            alert(s.lang === "my" ? "တွက်ချက်မှုရလဒ်ကို Copy ကူးယူပြီးပါပြီ။" : "Calculation copied to clipboard.");
        });
    }
}

function onWindowResize() {
    const container = document.getElementById("viewport");
    if (!container || !camera || !renderer) return;

    const width = container.clientWidth;
    const height = container.clientHeight;
    if (width === 0 || height === 0) return;

    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height, false);
}

function animate() {
    requestAnimationFrame(animate);
    if (controls) controls.update();
    if (renderer && scene && camera) renderer.render(scene, camera);
}

window.addEventListener("DOMContentLoaded", () => {
    initTelegram();
    requestAnimationFrame(() => init3D());
});
</script>
